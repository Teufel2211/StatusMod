plugins {
    id 'dev.architectury.loom'
}

repositories {
    mavenCentral()
    maven { url = uri('https://maven.architectury.dev/') }
    maven { url = uri('https://maven.fabricmc.net/') }
    maven { url = uri('https://maven.minecraftforge.net/') }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

sourceSets {
    main {
        java {
            srcDirs += file('../../common/src/main/java')
            srcDirs += file('../../fabric/src/main/java')
        }
        resources {
            srcDirs += file('../../common/src/main/resources')
            srcDirs += file('../../fabric/src/main/resources')
        }
    }
}

processResources {
    filesMatching("fabric.mod.json") {
        expand "version": project.version, "loader_version": project.findProperty('loader_version') ?: "0.16.14"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.findProperty('minecraft_version') ?: '26.3'}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.findProperty('loader_version') ?: '0.16.14'}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.findProperty('fabric_api_version') ?: '0.158.3+26.3'}"
    modImplementation "dev.architectury:architectury-fabric:${project.findProperty('architectury_version') ?: '13.0.11'}"
    compileOnly "dev.architectury:architectury:${project.findProperty('architectury_version') ?: '13.0.11'}"
    implementation "com.google.code.gson:gson:2.11.0"
}

tasks.register('writeVersion') {
    doLast {
        println "Version: ${project.version}"
    }
}