pluginManagement {
	repositories {
		maven { url = uri('https://maven.architectury.dev/') }
		maven { url = uri('https://maven.fabricmc.net/') }
		maven { url = uri('https://maven.minecraftforge.net/') }
		maven { url = uri('https://maven.quiltmc.org/repository/release/') }
		mavenCentral()
		gradlePluginPortal()
	}
	plugins {
		id 'dev.architectury.loom' version '1.17.491'
		id 'org.quiltmc.loom' version "${quilt_loom_version}"
	}
}

// target_loader: when set (e.g. "neoforge"), only include that loader + common.
// This prevents Quilt Loom from configuring (and failing) when building NeoForge,
// and vice-versa. Empty/unset = include all (for sanity builds from root).
def targetLoader = settings.providers.gradleProperty('target_loader').orNull
def allLoaders = ['common', 'fabric', 'forge', 'neoforge', 'quilt']

if (targetLoader && targetLoader in ['fabric', 'forge', 'neoforge', 'quilt']) {
	include 'common'
	include targetLoader
} else {
	include 'common'
	include 'fabric'
	include 'forge'
	include 'neoforge'
	include 'quilt'
}