plugins {
    id 'dev.architectury.loom'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    main {
        java {
            srcDirs += file('../common/src/main/java')
        }
        resources {
            srcDirs += file('../common/src/main/resources')
        }
    }
}

loom {
    silentMojangMappingsLicense()
}

// Expand ${version} so standalone builds (without build-multiversion.ps1's
// Expand-MetadataVersion step) also produce correct jars. Harmless no-op
// when the placeholder was already replaced.
processResources {
    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    forge "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly "dev.architectury:architectury:${architectury_version}"
    implementation "com.google.code.gson:gson:2.11.0"
}
