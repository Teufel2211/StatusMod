name: Probe Fabric Maven

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Probe
        shell: pwsh
        run: |
          $url = "https://maven.fabricmc.net/net/fabricmc/fabric-loader/fabric-loader/0.19.3/fabric-loader-0.19.3.jar"
          Write-Host "=== env proxies ==="
          Get-ChildItem Env: | Where-Object { $_.Name -match 'proxy|PROXY' } | ForEach-Object { "$($_.Name)=$($_.Value)" }
          Write-Host "=== DNS ==="
          try { Resolve-DnsName maven.fabricmc.net -ErrorAction Stop | Select-Object Name,Type,IPAddress,NameHost | Format-Table -AutoSize | Out-String | Write-Host } catch { Write-Host "dns-fehler: $($_.Exception.Message)" }
          Write-Host "=== curl variants (http_code) ==="
          $variants = @(
            @{ n = "default"; a = @() },
            @{ n = "http1.1"; a = @("--http1.1") },
            @{ n = "ipv4"; a = @("-4") },
            @{ n = "browser-ua"; a = @("-A", "Mozilla/5.0 (Windows NT 10.0; Win64; x64)") },
            @{ n = "no-proxy"; a = @("--noproxy", "*") }
          )
          foreach ($v in $variants) {
            $code = & curl.exe -sS -o NUL -w "%{http_code}" -m 30 @($v.a) $url 2>&1
            Write-Host ("curl[{0}] -> {1}" -f $v.n, $code)
          }
          Write-Host "=== curl verbose headers (default) ==="
          & curl.exe -sS -D - -o NUL -m 30 $url 2>&1 | Select-Object -First 20 | ForEach-Object { Write-Host $_ }
          Write-Host "=== IWR ==="
          try { $r = Invoke-WebRequest -Uri $url -Method Head -TimeoutSec 30 -UseBasicParsing; Write-Host "IWR -> $([int]$r.StatusCode)" } catch { Write-Host "IWR-fehler: $($_.Exception.Message)" }
          Write-Host "=== control: piston-meta ==="
          $c2 = & curl.exe -sS -o NUL -w "%{http_code}" -m 30 "https://piston-meta.mojang.com/mc/game/version_manifest_v2.json" 2>&1
          Write-Host "piston-meta -> $c2"
          Write-Host "=== meta.fabricmc.net ==="
          $c3 = & curl.exe -sS -o NUL -w "%{http_code}" -m 30 "https://meta.fabricmc.net/v2/versions/loader/1.21.11/0.19.3" 2>&1
          Write-Host "meta.fabricmc.net -> $c3"
          Write-Host "=== loader metadata on maven ==="
          $c4 = & curl.exe -sS -o NUL -w "%{http_code}" -m 30 "https://maven.fabricmc.net/net/fabricmc/fabric-loader/maven-metadata.xml" 2>&1
          Write-Host "maven-metadata.xml -> $c4"
